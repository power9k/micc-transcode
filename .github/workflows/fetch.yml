name: tmp fetch audio
on:
  push:
    branches: [tmp-audio-transfer]
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, 'audio file')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o tieng-viet.mp3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3LGciyeq1CHNF07eImQr3RGMpPs/5f8192de-8f8a-4a1a-b763-d0f6e0bc1859.mp3'
          ls -la tieng-viet.mp3
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add tieng-viet.mp3 && git commit -m "audio file" && git push
