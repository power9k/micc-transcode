# Branch-only helper for the Academy video sessions (not part of the main pipeline; touches nothing else).
# Runs when a request file is pushed to a claude/* branch, pushes the word-level transcript back to that branch.
name: Academy - chép lời từng chữ (Whisper)
on:
  push:
    branches: ['claude/**']
    paths: ['asr/requests/**']
permissions:
  contents: write
concurrency:
  group: asr-words-${{ github.ref }}
  cancel-in-progress: false
jobs:
  asr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lưu đệm mô hình Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: asr-words-whisper-v1
      - name: Cài ffmpeg + faster-whisper
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper 'av<14'
      - name: Chép lời từng chữ
        run: python asr/run.py
      - name: Đẩy kết quả về nhánh
        run: |
          git config user.name "micc-asr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add asr/results
          git diff --cached --quiet || (git commit -m "ASR: kết quả chép lời từng chữ" && git push)
