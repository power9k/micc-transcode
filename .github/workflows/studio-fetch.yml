# Chỉ chạy trên nhánh claude/** khi đổi studio-runner/fetch/list.json – tải cảnh quay / nhạc miễn phí (Mixkit) cho video dựng thử, đẩy kết quả về nhánh.
name: Studio - tải tư liệu miễn phí
on:
  push:
    branches: ['claude/**']
    paths: ['studio-runner/fetch/list.json']
permissions:
  contents: write
concurrency:
  group: studio-fetch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cài ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Tải và nén
        run: python3 studio-runner/fetch/fetch.py
      - name: Đẩy về nhánh
        run: |
          git config user.name "micc-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add studio-runner/fetch/out
          git diff --cached --quiet || (git commit -m "Studio: tư liệu miễn phí đã tải" && git pull --rebase -q && git push)
